# Codemagic build recipe for producing an iOS .ipa that can be sideloaded
# onto an iPhone with AltStore using a FREE Apple ID.
#
# Alternative to .github/workflows/ios-ipa.yml (GitHub Actions), which builds
# the same .ipa automatically for every release tag. Both run the shared
# recipe in tool/build_ios_ipa.sh; see that file for why every framework is
# re-signed and why tool/ldid_gate.py can fail the build.

workflows:
  ios-sideload-unsigned:
    name: iOS unsigned IPA (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build, re-sign, verify and package the .ipa
        script: bash tool/build_ios_ipa.sh
    artifacts:
      # Download this from the Codemagic build page, then install via AltStore.
      - build/ios/iphoneos/*.ipa
