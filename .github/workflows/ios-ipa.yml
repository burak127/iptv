# Builds the iPhone app as a sideload .ipa on a GitHub-hosted Mac, so nobody
# needs a Mac of their own.
#
# - Push a tag like v1.3.0: the .ipa is built and attached to that tag's
#   GitHub release. If the release doesn't exist yet it is created, titled
#   and described from the annotated tag's message.
# - Actions > "iOS IPA (sideload)" > Run workflow: builds any branch and keeps
#   the .ipa as a downloadable run artifact. Works in forks too, so anyone can
#   build their own edited version.
#
# The recipe itself lives in tool/build_ios_ipa.sh (shared with
# codemagic.yaml); it explains why every binary gets re-signed.
name: iOS IPA (sideload)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - run: flutter pub get

      - name: Build, re-sign, verify and package the .ipa
        run: bash tool/build_ios_ipa.sh "build/ipa/iptv-player-${GITHUB_REF_NAME//\//-}-ios.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-ios
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Attach the .ipa to this tag's GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # actions/checkout leaves a lightweight copy of the tag; fetch the
            # real one so an annotated tag's message can become the notes.
            git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              title="$(git tag -l --format='%(contents:subject)' "$TAG")"
              git tag -l --format='%(contents:body)' "$TAG" > notes.md
            else
              title="$TAG"
              echo "iPhone: installér .ipa-filen med AltStore eller Sideloadly (se README)." > notes.md
            fi
            gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" build/ipa/*.ipa --clobber
